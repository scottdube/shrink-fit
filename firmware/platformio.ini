; PlatformIO — ESP32-S3 shrink-fit machine controller
; Energy-dosed induction cycle control. See ../docs/requirements.md.
[env]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Super Mini HW-747 is 4 MB flash. The devkitc-1 profile assumes 8 MB and lays a
; partition past the end — the board boot-loops with "partition 3 invalid …
; exceeds flash chip size 0x400000". Measured on first flash, 2026-08-09.
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = default.csv          ; 4 MB layout, keeps a data partition
board_build.arduino.memory_type = qio_qspi     ; not qio_opi — no octal PSRAM here

build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; Super Mini uses the S3's NATIVE USB — without these, Serial goes to the
  ; UART0 pins and the USB console stays silent. Standard S3 gotcha.
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; Machine firmware
[env:esp32s3_shrink]
build_src_filter = +<*> -<bringup.cpp> -<testrig.cpp>

; First-flash diagnostic — PSRAM/flash report, I2C scan, listen-only TWAI sniffer.
; Does not transmit and cannot jam the bus.
[env:bringup]
build_src_filter = +<bringup.cpp>

; Timed-cycle test rig — exact N-second runs so coil comparisons are comparable.
; Switching only, no logging.
[env:testrig]
build_src_filter = +<testrig.cpp>

; --- OTA upload for the test rig -------------------------------------------
; Same firmware as [env:testrig]; only the upload path differs. USB is still
; required for the FIRST flash and for setting credentials (wifi <ssid> <pass>).
;
; The partition table is default.csv, which carries app0/app1 at 1.25 MB each —
; dual OTA slots, verified 2026-08-27. The WiFi build is ~58% of one slot.
;
; OTA is serviced ONLY while the rig is idle; see the guard in testrig.cpp.
[env:testrig_ota]
build_src_filter = +<testrig.cpp>
upload_protocol  = espota
upload_port      = shrinkfit-testrig.local   ; or the IP the rig prints at boot

lib_deps =
  adafruit/Adafruit INA228 Library    ; low-side shunt, hardware energy accum (CR-01)
  adafruit/Adafruit MAX31855 library  ; K-type, post-field sampling only (CR-02)

; CAN uses the ESP32-S3's built-in TWAI peripheral via driver/twai.h — part of
; the framework, no library needed. Transceiver is an SN65HVD230 breakout
; (3.3 V native, so no level shifting).

; HMI is deliberately unspecified. The control path must not depend on it —
; encoder + small display can land later without touching the state machine.

; --- INA228 bring-up on a 38-pin ESP32 devkit -------------------------------
; A SEPARATE board from the test rig, deliberately. The rig works and must not be
; disturbed to try a new peripheral; this also starts the ESP32 port
; incrementally and tests I2C on the silicon that will carry it (requirements
; 6.12). Overrides the S3 settings in [env] -- native-USB CDC flags and
; qio_qspi memory type are S3-only and wrong here.
[env:ina228_esp32]
board                   = esp32dev
build_src_filter        = +<ina228_test.cpp>
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags             = -DCORE_DEBUG_LEVEL=3

; OTA for the INA228 bring-up board. Same firmware as [env:ina228_esp32]; only
; the upload path differs. USB is still needed for the FIRST flash and to set
; credentials (wifi <ssid> <pass>).
[env:ina228_ota]
board                   = esp32dev
build_src_filter        = +<ina228_test.cpp>
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags             = -DCORE_DEBUG_LEVEL=3
upload_protocol         = espota
upload_port             = shrinkfit-ina228.local

; Two-node CAN bench test. Same binary on BOTH boards; GPIO27 picks the role
; (open = talker, grounded = listener). Proves the transceivers and TWAI setup
; without a rectifier -- the verification our CAN hardware has never had.
[env:can_loop]
board                   = esp32dev
build_src_filter        = +<can_loop.cpp>
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags             = -DCORE_DEBUG_LEVEL=3

; Second node on an ESP32-S3 instead. Only needed if you would rather not use a
; classic ESP32 -- the S3's GPIO26-32 are its flash/PSRAM bus, so the default
; RX pin is unusable there. Role jumper moves to GPIO6, no onboard plain LED.
[env:can_loop_s3]
board            = esp32-s3-devkitc-1
build_src_filter = +<can_loop.cpp>
build_flags      = -DCORE_DEBUG_LEVEL=3 -DARDUINO_USB_CDC_ON_BOOT=1
                   -DPIN_CAN_TX=4 -DPIN_CAN_RX=5 -DPIN_ROLE=6 -DPIN_LED=-1

; Listener with the role fixed at build time. The role jumper is a convenience so
; one binary serves both ends; when the socket will not grip a jumper pin -- four
; rounds lost to intermittent contact on a pin whose position was correct all
; along -- it stops being a convenience. Nothing to seat, nothing to misread.
[env:can_loop_listener]
board                   = esp32dev
build_src_filter        = +<can_loop.cpp>
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags             = -DCORE_DEBUG_LEVEL=3 -DROLE_FIXED=0
